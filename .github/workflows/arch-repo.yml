name: arch-repo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4

      - name: Build package
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -eux
          pacman -Syu --noconfirm --needed git sudo nodejs gnupg
          useradd -m builder || true
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          printf '%s' "$GPG_PRIVATE_KEY" > /home/builder/private.asc
          chown builder:builder /home/builder/private.asc
          chown -R builder:builder "$GITHUB_WORKSPACE"
          cat > /tmp/build.sh <<'SH'
          set -eux
          cd "$GITHUB_WORKSPACE"
          gpg --batch --import /home/builder/private.asc
          KEYID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec:/ {print $5; exit}')
          test -n "$KEYID"
          makepkg -s --noconfirm --sign --key "$KEYID"
          echo "$KEYID" > .keyid
          SH
          chmod +x /tmp/build.sh
          runuser -u builder -- env GITHUB_WORKSPACE="$GITHUB_WORKSPACE" bash /tmp/build.sh
          rm -f /home/builder/private.asc

      - name: Build pacman repository
        run: |
          set -eux
          KEYID=$(cat .keyid)
          mkdir -p public/x86_64
          cp ./*.pkg.tar.zst ./*.pkg.tar.zst.sig public/x86_64/
          cp waydroid-rootless.asc public/x86_64/
          chown -R builder:builder public
          runuser -u builder -- env GITHUB_WORKSPACE="$GITHUB_WORKSPACE" KEYID="$KEYID" bash -c '
            set -eux
            cd "$GITHUB_WORKSPACE"
            repo-add --sign --key "$KEYID" public/x86_64/waydroid-rootless.db.tar.gz public/x86_64/*.pkg.tar.zst
          '
          ls -l public/x86_64

      - name: Publish gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          cd public
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Update pacman repository"
          git push --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages
